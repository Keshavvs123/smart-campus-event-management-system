<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Contact Headquarters</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row pt-5 pb-5">
            <div class="col-md-6 mx-auto">
                <h2 class="text-center">Contact Us</h2>
                <hr>
                <form class="mt-4" action="#" method="get">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Your Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">University Email</label>
                        <input type="email" class="form-control" placeholder="Your Email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="How can we help?"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-primary btn-block" onclick="alert('Message Sent (Demo)')">Send Message</button>
                    </div>
                </form>
                <div class="mt-5 text-center text-muted">
                    <p><i class="fas fa-envelope"></i> admin@smcem.university</p>
                    <p><i class="fas fa-phone"></i> +1 800-455-8833</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
